name: Apply mobile layout fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch mobile CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('style.css')
          css = path.read_text(encoding='utf-8')

          marker = '/* =========================================================\n   MOBILE LAYOUT HOTFIX\n========================================================= */'
          if marker in css:
              raise SystemExit('Mobile hotfix already exists; nothing to do.')

          css += r'''


/* =========================================================
   MOBILE LAYOUT HOTFIX
   Fixes observed on iPhone/Safari:
   - Prevents the Turkish hero headline from clipping the final "m".
   - Gives the lion artwork a portrait-safe frame on narrow screens.
   - Prevents image cropping caused by the square desktop frame.
   - Keeps hero actions inside the viewport.
========================================================= */

@media (max-width: 800px){

  .hero-content{
    min-width:0;
    overflow:visible;
  }

  .hero h1{
    width:100%;
    max-width:none;
    min-width:0;
    padding-right:0;
    font-size:clamp(44px,11.8vw,50px);
    line-height:.98;
    letter-spacing:-.055em;
    word-break:normal;
    overflow-wrap:normal;
    hyphens:none;
    overflow:visible;
  }

  .hero-actions,
  .hero-actions .button{
    width:100%;
    max-width:100%;
  }

  .hero-actions .button{
    min-width:0;
  }

  .hero-visual{
    width:100%;
    min-width:0;
    padding-left:0;
    padding-right:0;
    padding-top:28px;
    padding-bottom:44px;
  }

  .hero-image-frame{
    width:100%;
    max-width:100%;
    aspect-ratio:4 / 5;
    overflow:hidden;
    border-radius:16px;
  }

  .hero-image{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    background:#090a0b;
  }

  .hero-image-brand{
    right:14px;
    bottom:14px;
    width:96px;
    padding:7px 9px;
  }
}

@media (max-width:430px){

  .hero h1{
    font-size:clamp(42px,11.4vw,48px);
    line-height:.99;
    letter-spacing:-.052em;
  }

  .hero-content{
    padding-left:0;
    padding-right:0;
  }

  .hero-description{
    max-width:100%;
  }

  .hero-image-frame{
    aspect-ratio:4 / 5;
    border-radius:14px;
  }
}
'''

          path.write_text(css, encoding='utf-8')
          PY

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css .github/workflows/mobile-layout-fix.yml
          git commit -m "Fix mobile hero headline and lion image layout"
          git rm .github/workflows/mobile-layout-fix.yml
          git commit -m "Remove one-time mobile layout fix workflow"
          git push
