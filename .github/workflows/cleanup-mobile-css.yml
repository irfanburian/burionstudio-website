name: Cleanup mobile CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consolidate mobile hero fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('style.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* =========================================================\n   MOBILE LAYOUT FIXES — iOS / NARROW SCREENS\n========================================================= */'
          if marker not in css:
              raise SystemExit('Expected mobile fix block was not found.')

          css = css.split(marker, 1)[0].rstrip() + r'''


/* =========================================================
   23 — MOBILE HERO SAFETY
   Keep the original responsive system as the source of truth.
   These narrow-screen rules only protect typography and the
   square hero artwork from Safari clipping/cropping.
========================================================= */

@media (max-width:800px){

  .hero-content{
    min-width:0;
    overflow:visible;
  }

  .hero h1{
    width:100%;
    max-width:100%;
    min-width:0;
    padding-right:0;
    font-size:clamp(44px,12.2vw,58px);
    line-height:.98;
    letter-spacing:-.055em;
    word-break:normal;
    overflow-wrap:normal;
    hyphens:none;
    overflow:visible;
  }

  .hero-actions,
  .hero-actions .button{
    width:100%;
    max-width:100%;
    min-width:0;
  }

  .hero-image-frame{
    width:100%;
    max-width:500px;
    aspect-ratio:1 / 1;
    overflow:hidden;
    border-radius:16px;
  }

  .hero-image{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
  }

}

@media (max-width:430px){

  .hero h1{
    font-size:clamp(43px,12.1vw,50px);
    line-height:1;
    letter-spacing:-.052em;
  }

  .hero-description{
    max-width:100%;
  }

  .hero-image-frame{
    border-radius:14px;
  }

}
'''
          p.write_text(css, encoding='utf-8')
          PY

      - name: Commit CSS cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "fix: consolidate mobile hero responsive rules"
          git push
