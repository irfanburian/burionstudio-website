name: Build share icon

on:
  push:
    paths:
      - 'assets/brand/burion-share-icon.svg'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/brand/burion-share-icon.svg -o assets/brand/burion-share-icon.png
      - name: Point pages to PNG icon
        run: |
          sed -i 's/burion-share-icon\.svg/burion-share-icon.png/g; s/type="image\/svg+xml" sizes="1024x1024"/type="image\/png" sizes="1024x1024"/g' index.html tr/index.html ru/index.html
      - name: Commit PNG and page references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/burion-share-icon.png index.html tr/index.html ru/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix share icon MIME type'
          git push
