name: Complete project and statement translations

on:
  push:
    paths:
      - '.github/workflows/i18n-projects-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch translation system
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          if 'projectTrivia' in s:
              raise SystemExit('Translation patch already present.')

          s = s.replace(
              'footer: "Independent developer creating games, apps and digital experiences."\n',
              '''projectTriviaCategory: "GAME · IN DEVELOPMENT", projectTrivia: "Trivia", projectTriviaDescription: "A competitive quiz experience designed around knowledge, speed and progression.", projectTriviaStatus: "IN DEVELOPMENT",\n      projectAgricultureCategory: "APPLICATION · CONCEPT", projectAgriculture: "Agricultural Platform", projectAgricultureDescription: "A digital platform focused on smarter agricultural decisions.", projectAgricultureStatus: "CONCEPT",\n      projectStudioCategory: "DIGITAL PRODUCT · LIVE", projectStudio: "Burion Studio", projectStudioDescription: "The digital home of an independent developer and creative studio.", projectStudioStatus: "LIVE",\n      statementDevelopment: "DEVELOPMENT", statementDevelopmentText: "Clean. Scalable. Stable.", statementPerformance: "PERFORMANCE", statementPerformanceText: "Fast. Efficient. Optimized.", statementDesign: "DESIGN", statementDesignText: "Minimal. Intentional. Clear.", statementExperience: "EXPERIENCE", statementExperienceText: "Built to be used.",\n      footer: "Independent developer creating games, apps and digital experiences."\n''', 1)

          s = s.replace(
              'footer: "Oyunlar, uygulamalar ve dijital deneyimler geliştiren bağımsız geliştirici."\n',
              '''projectTriviaCategory: "OYUN · GELİŞTİRİLİYOR", projectTrivia: "Trivia", projectTriviaDescription: "Bilgi, hız ve ilerleme üzerine tasarlanmış rekabetçi bir quiz deneyimi.", projectTriviaStatus: "GELİŞTİRİLİYOR",\n      projectAgricultureCategory: "UYGULAMA · KONSEPT", projectAgriculture: "Tarım Platformu", projectAgricultureDescription: "Daha akıllı tarımsal kararları desteklemek için tasarlanan dijital platform.", projectAgricultureStatus: "KONSEPT",\n      projectStudioCategory: "DİJİTAL ÜRÜN · YAYINDA", projectStudio: "Burion Studio", projectStudioDescription: "Bağımsız geliştirici ve yaratıcı stüdyonun dijital merkezi.", projectStudioStatus: "YAYINDA",\n      statementDevelopment: "GELİŞTİRME", statementDevelopmentText: "Temiz. Ölçeklenebilir. Kararlı.", statementPerformance: "PERFORMANS", statementPerformanceText: "Hızlı. Verimli. Optimize.", statementDesign: "TASARIM", statementDesignText: "Minimal. Bilinçli. Net.", statementExperience: "DENEYİM", statementExperienceText: "Kullanılmak için tasarlandı.",\n      footer: "Oyunlar, uygulamalar ve dijital deneyimler geliştiren bağımsız geliştirici."\n''', 1)

          s = s.replace(
              'footer: "Независимый разработчик игр, приложений и цифровых продуктов."\n',
              '''projectTriviaCategory: "ИГРА · В РАЗРАБОТКЕ", projectTrivia: "Trivia", projectTriviaDescription: "Соревновательная викторина, созданная вокруг знаний, скорости и прогрессии.", projectTriviaStatus: "В РАЗРАБОТКЕ",\n      projectAgricultureCategory: "ПРИЛОЖЕНИЕ · КОНЦЕПТ", projectAgriculture: "Сельскохозяйственная платформа", projectAgricultureDescription: "Цифровая платформа для более эффективных решений в сельском хозяйстве.", projectAgricultureStatus: "КОНЦЕПТ",\n      projectStudioCategory: "ЦИФРОВОЙ ПРОДУКТ · LIVE", projectStudio: "Burion Studio", projectStudioDescription: "Цифровой дом независимого разработчика и творческой студии.", projectStudioStatus: "LIVE",\n      statementDevelopment: "РАЗРАБОТКА", statementDevelopmentText: "Чисто. Масштабируемо. Стабильно.", statementPerformance: "ПРОИЗВОДИТЕЛЬНОСТЬ", statementPerformanceText: "Быстро. Эффективно. Оптимизировано.", statementDesign: "ДИЗАЙН", statementDesignText: "Минималистично. Осознанно. Чётко.", statementExperience: "ОПЫТ", statementExperienceText: "Создано для использования.",\n      footer: "Независимый разработчик игр, приложений и цифровых продуктов."\n''', 1)

          marker = '    const build = document.querySelector(".build-section");'
          inject = '''    // Brand statement translations
    const statementItems = document.querySelectorAll(".brand-statement .statement-item");
    const statementValues = [
      [t.statementDevelopment, t.statementDevelopmentText],
      [t.statementPerformance, t.statementPerformanceText],
      [t.statementDesign, t.statementDesignText],
      [t.statementExperience, t.statementExperienceText]
    ];
    statementItems.forEach((item, i) => {
      if (!statementValues[i]) return;
      const strong = item.querySelector("strong");
      const detail = item.querySelector("span:last-child");
      if (strong) strong.textContent = statementValues[i][0];
      if (detail) detail.textContent = statementValues[i][1];
    });

'''
          if marker not in s:
              raise SystemExit('Expected build marker not found.')
          s = s.replace(marker, inject + marker, 1)

          marker = '    const about = document.querySelector("#about");'
          inject = '''    // Project card translations
    const projectCards = document.querySelectorAll("#projects .project-card");
    const projectValues = [
      [t.projectTriviaCategory, t.projectTrivia, t.projectTriviaDescription, t.projectTriviaStatus],
      [t.projectAgricultureCategory, t.projectAgriculture, t.projectAgricultureDescription, t.projectAgricultureStatus],
      [t.projectStudioCategory, t.projectStudio, t.projectStudioDescription, t.projectStudioStatus]
    ];
    projectCards.forEach((card, i) => {
      const values = projectValues[i];
      if (!values) return;
      const category = card.querySelector(".project-category");
      const title = card.querySelector(".project-info h3");
      const description = card.querySelector(".project-info p");
      const status = card.querySelector(".project-status");
      if (category) category.textContent = values[0];
      if (title) title.textContent = values[1];
      if (description) description.textContent = values[2];
      if (status) status.textContent = values[3];
    });

'''
          if marker not in s:
              raise SystemExit('Expected about marker not found.')
          s = s.replace(marker, inject + marker, 1)

          s = s.replace(
              '    document.documentElement.lang = language;\n',
              '    document.documentElement.lang = language;\n    document.title = language === "tr" ? "Burion Studio — Bağımsız Oyun ve Uygulamalar" : language === "ru" ? "Burion Studio — Независимые игры и приложения" : "Burion Studio — Independent Games & Apps";\n',
              1
          )

          p.write_text(s, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  <script src="script.js"></script>'
          if marker not in s:
              raise SystemExit('Script marker not found.')
          if 'document-title' in s:
              raise SystemExit('Index patch already present.')
          s = s.replace(marker, marker + '\n  <!-- document-title hook for i18n is handled by script.js -->', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js index.html
          git commit -m 'i18n: translate projects and brand statements'
          git rm .github/workflows/i18n-projects-fix.yml
          git commit -m 'chore: remove temporary i18n workflow'
          git push
